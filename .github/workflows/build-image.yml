name: Build images

# Pushes the backend and dashboard images (one run number for both).
# Auth is Workload Identity Federation: no service-account key exists anywhere.
# Repository variables: GCP_PROJECT_ID, GCP_REGION, GAR_REPO, WIF_PROVIDER, WIF_SERVICE_ACCOUNT.
on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "artifacts/control-tower/**"
      - "deploy/dashboard/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPO }}/dev/backend
      DASHBOARD_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPO }}/dev/dashboard
      TAG: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGISTRY" --quiet
      - name: Build
        run: |
          docker build \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            -t "$IMAGE:$TAG" backend
      - name: Smoke test the image
        run: docker run --rm "$IMAGE:$TAG" python -c "import app.main"
      - name: Build dashboard
        run: |
          docker build -f deploy/dashboard/Dockerfile \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            -t "$DASHBOARD_IMAGE:$TAG" .
      - name: Smoke test the dashboard image
        run: |
          docker run -d --name dash -p 127.0.0.1:18090:8090 "$DASHBOARD_IMAGE:$TAG"
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18090/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18090/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:18090/heatmap | grep -q '<div id="root">'
          docker rm -f dash
      - name: Push
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$DASHBOARD_IMAGE:$TAG"
      - run: echo "Pushed $IMAGE:$TAG and $DASHBOARD_IMAGE:$TAG (${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
