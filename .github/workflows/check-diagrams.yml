name: check-diagrams

# The structure of the recorded diagram versions in docs/diagram/ (S3-08b): paired files,
# numbering, status, embedded models and icons, and the tests of the skill's scripts.
# Standard library only: no draw.io, no secrets. Three operating systems, because a
# version is recorded on any of them.
on:
  pull_request:
    paths:
      - "docs/diagram/**"
      - ".agents/skills/diagram/**"
      - ".agents/rules/diagram.md"
      - ".claude/**"
      - ".github/workflows/check-diagrams.yml"
  push:
    branches: [dev]
    paths:
      - "docs/diagram/**"
      - ".agents/skills/diagram/**"
      - ".agents/rules/diagram.md"
      - ".claude/**"
      - ".github/workflows/check-diagrams.yml"

permissions:
  contents: read

jobs:
  check-diagrams:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s .agents/skills/diagram/tests
      - run: python .agents/skills/diagram/scripts/check_diagrams.py
