name: Compose smoke test

on:
  pull_request:
    paths:
      - "artifacts/control-tower/**"
      - "deploy/dashboard/**"
      - "pnpm-lock.yaml"
      - "deploy/compose/**"
      - "deploy/nginx/**"
      - "backend/**"
      - "scripts/compose-smoke.sh"
      - ".github/workflows/compose-smoke.yml"
  push:
    branches: [dev]
    paths:
      - "artifacts/control-tower/**"
      - "deploy/dashboard/**"
      - "pnpm-lock.yaml"
      - "deploy/compose/**"
      - "deploy/nginx/**"
      - "backend/**"
      - "scripts/compose-smoke.sh"
      - ".github/workflows/compose-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-smoke.sh
