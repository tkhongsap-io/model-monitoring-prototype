# Fly.io config — Control Tower backend (FastAPI + ML engines).
# `fly launch` will offer to reuse this file. Change `app` to your chosen name.
#
# Single always-on machine ON PURPOSE: the scenario player keeps its position and
# SSE subscribers in-process memory, so this must NOT scale out or auto-stop.
# A machine restart resets to baked tick 0 — which is exactly the demo's reset.

app = "model-monitoring-backend"
primary_region = "sin"  # Singapore — closest Fly region to Thailand (True Corp)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # keep the player + SSE alive (if flyctl rejects, use: false)
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1        # in-memory singleton player — never run two

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # ML libs (Evidently/NannyML/SHAP) are heavy at import; 512mb is tight
