# Laptop and CI settings (S1-06). Never use this file on the test host.
# The PostgreSQL password and the API key are local test values, not secrets:
# Only the local test API key's SHA-256 is here.
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "monitor", "-d", "monitor"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ../../backend
    image: model-monitor-backend:local
    environment:
      DATABASE_URL: postgresql://monitor:monitor@postgres:5432/monitor
      BATCH_API_KEY_SHA256: rtr-fraud-validation:ca9263478834f0d9f054e84eda1a55dee86d8a6551f27aa8a2c751a4b541b200
      BATCH_EVALUATOR_INTERVAL_S: "5"
      # Empty unless langfuse-smoke sets it: the plain smoke test has no Langfuse (skipped).
      LANGFUSE_HOST: ${BACKEND_LANGFUSE_HOST:-}
      # local test values
      LANGFUSE_PROJECTS: unrouted,rtr-fraud-validation
      LANGFUSE_PK__UNROUTED: pk-lf-local-00000000-0000-0000-0000-000000000000
      LANGFUSE_SK__UNROUTED: sk-lf-local-00000000-0000-0000-0000-000000000000
      LANGFUSE_PK__RTR_FRAUD_VALIDATION: pk-lf-local-00000000-0000-0000-0000-000000000000
      LANGFUSE_SK__RTR_FRAUD_VALIDATION: sk-lf-local-00000000-0000-0000-0000-000000000000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  collector:
    volumes:
      - ./otel-collector.routes.local.yaml:/etc/otelcol/routes.yaml:ro
    environment:
      LANGFUSE_OTLP_AUTH__UNROUTED: cGstbGYtbG9jYWwtMDAwMDAwMDAtMDAwMC0wMDAwLTAwMDAtMDAwMDAwMDAwMDAwOnNrLWxmLWxvY2FsLTAwMDAwMDAwLTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMA==   # local test values
      LANGFUSE_OTLP_AUTH__RTR_FRAUD_VALIDATION: cGstbGYtbG9jYWwtMDAwMDAwMDAtMDAwMC0wMDAwLTAwMDAtMDAwMDAwMDAwMDAwOnNrLWxmLWxvY2FsLTAwMDAwMDAwLTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMA==
      OTLP_TOKEN: local-dev-otlp-token-not-a-secret   # local test value, not a secret
    ports:
      - "127.0.0.1:4318:4318"

  trace-check:
    image: model-monitor-backend:local
    environment:
      # Empty unless langfuse-smoke sets it: the plain smoke test has no Langfuse (skipped item).
      CHECK_LANGFUSE_URL: ${CHECK_LANGFUSE_URL:-}
      # local test values
      LANGFUSE_PROJECTS: unrouted,rtr-fraud-validation
      LANGFUSE_PK__UNROUTED: pk-lf-local-00000000-0000-0000-0000-000000000000
      LANGFUSE_SK__UNROUTED: sk-lf-local-00000000-0000-0000-0000-000000000000
      LANGFUSE_PK__RTR_FRAUD_VALIDATION: pk-lf-local-00000000-0000-0000-0000-000000000000
      LANGFUSE_SK__RTR_FRAUD_VALIDATION: sk-lf-local-00000000-0000-0000-0000-000000000000
      CHECK_DATABASE_URL: postgresql://monitor:monitor@postgres:5432/monitor   # local test value

  langfuse-projects: {image: model-monitor-backend:local}

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/dashboard/Dockerfile
    image: model-monitor-dashboard:local

volumes:
  pgdata:
