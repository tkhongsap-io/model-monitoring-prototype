# GCP test host settings (S1-04): VM ai-ml-monitoring-dev-env, Cloud SQL sandbox-pg17-db.
# Never use this file on a laptop. On the VM, run from /opt/model-monitor/compose:
#   docker compose -f compose.yaml -f compose.testhost.yaml up -d --wait
# BACKEND_IMAGE and DASHBOARD_IMAGE come from the .env file in that folder (image names, not secrets); use the same run number for both.
# Every secret comes from /opt/model-monitor/backend.env on the VM (chmod 600), never from
# git. See deploy/compose/TESTHOST.md.
services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is not set}
    env_file:
      - /opt/model-monitor/backend.env
    volumes:
      # Cloud SQL server CA for sslmode=verify-ca (a public certificate, not a secret)
      - /opt/model-monitor/cloudsql-server-ca.pem:/etc/model-monitor/cloudsql-server-ca.pem:ro
    ports:
      # For operators inside the VM. The GCP jobs use nginx on port 80 (deploy/nginx).
      - "127.0.0.1:8000:8000"

  collector:
    env_file:
      # OTLP_TOKEN of the GCP jobs (S1-06); made by make-collector-env.sh, mode 600
      - path: /opt/model-monitor/collector.env
        required: true

  dashboard:
    image: ${DASHBOARD_IMAGE:?DASHBOARD_IMAGE is not set}

  trace-check:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is not set}
    env_file:
      # CHECK_DATABASE_URL with monitor_readonly (S1-11); made by make-check-env.sh, mode 600
      - /opt/model-monitor/check.env
    volumes:
      - /opt/model-monitor/cloudsql-server-ca.pem:/etc/model-monitor/cloudsql-server-ca.pem:ro
