# Generated by the project tool (backend/scripts/langfuse_projects.py) from
# langfuse-projects/*.yaml (S2-03b). Do not edit.
connectors:
  routing/langfuse:
    default_pipelines:
    - traces/langfuse-unrouted
    error_mode: ignore
    table:
    - context: span
      condition: resource.attributes["use.case.id"] == "rtr-fraud-validation" or (resource.attributes["use.case.id"] == nil and attributes["use_case_id"] == "rtr-fraud-validation") or (resource.attributes["use.case.id"] == nil and attributes["use_case_id"] == nil and resource.attributes["service.name"] == "rtr-fraud-validation")
      pipelines:
      - traces/langfuse-rtr-fraud-validation
exporters:
  otlphttp/langfuse-unrouted:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: Basic ${env:LANGFUSE_OTLP_AUTH__UNROUTED}
      x-langfuse-ingestion-version: '4'
  otlphttp/langfuse-rtr-fraud-validation:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: Basic ${env:LANGFUSE_OTLP_AUTH__RTR_FRAUD_VALIDATION}
      x-langfuse-ingestion-version: '4'
service:
  pipelines:
    traces/langfuse-unrouted:
      receivers:
      - routing/langfuse
      exporters:
      - otlphttp/langfuse-unrouted
    traces/langfuse-rtr-fraud-validation:
      receivers:
      - routing/langfuse
      exporters:
      - otlphttp/langfuse-rtr-fraud-validation
