# OTel Collector for the batch MVP (S1-06).
# Writes the spans to the log, to /data/spans.jsonl (rotated) and to Langfuse (S2-03).
# S3-03 adds the memory limit and attribute filter. Credentials come from the environment.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # The OTLP token of the GCP jobs (S1-06). Only the external receiver uses it.
  bearertokenauth:
    scheme: Bearer
    token: ${env:OTLP_TOKEN}

receivers:
  otlp:                        # internal: the backend, inside the Docker network
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  otlp/external:               # GCP jobs, only through nginx (/otlp/*); never published
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: bearertokenauth

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic
  file:
    path: /data/spans.jsonl
    # The trace check tool reads this file and its rotated copies (S2-03: kept, size-limited).
    rotation:
      max_megabytes: 100
      max_days: 14
      max_backups: 5
  # Langfuse OTLP endpoint (S2-03); the project keys come from the environment.
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
      x-langfuse-ingestion-version: "4"

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp, otlp/external]
      processors: [batch]
      exporters: [debug, file, otlphttp/langfuse]
