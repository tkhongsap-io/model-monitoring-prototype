# Front door of the GCP test host on port 443 (S1-04, S1-06).
# Install as /etc/nginx/sites-available/monitor-test-host and link it into sites-enabled.
# The certificate comes from make-private-ca.sh. Runbook: README.md in this folder.
# No port 80 server here: plain HTTP is not served, and the VPC firewall opens only 443.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/test-host/server.crt;
    ssl_certificate_key /etc/nginx/tls/test-host/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Only the two backend paths that the GCP jobs call (S1-06).
    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/batch/runs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else, including /api/live/*, is not served on port 443.
    location / {
        return 404;
    }
}
