# Langfuse — self-hosted (the "in-country / PDPA" path).
#
# The prototype v1 uses Langfuse CLOUD (free tier) for speed. When True wants Langfuse
# running on its own infrastructure — so prompts/outputs never leave the estate (the
# proposal's strongest PDPA posture) — this is a config flip, not a rebuild:
#
#   1. docker compose -f docker/langfuse-selfhost.compose.yml up -d
#   2. open http://localhost:3000, create a project, copy its keys
#   3. set LANGFUSE_HOST=http://localhost:3000 + the new keys in .env
#   4. re-run `python run_all.py`  — the LLM lane now traces to the local instance
#
# This is a minimal single-node dev stack. For a real deployment follow Langfuse's
# official self-host guide (Postgres + Clickhouse + Redis + S3/MinIO, secrets, TLS):
# https://langfuse.com/self-hosting
services:
  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: changeme-local-only
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:changeme-local-only@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme-generate-a-real-secret
      SALT: changeme-generate-a-real-salt
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_pgdata:
